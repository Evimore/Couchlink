<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2F8F"/>
      <stop offset="0.55" stop-color="#4B3BC4"/>
      <stop offset="1" stop-color="#7A3FD6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" gradientUnits="userSpaceOnUse" x1="512" y1="486" x2="512" y2="150">
      <stop offset="0" stop-color="#FFC75A"/>
      <stop offset="1" stop-color="#FF8A5B"/>
    </linearGradient>
    <linearGradient id="couch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#120C3D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- The link: arcs rising from the couch -->
  <g fill="none" stroke="url(#arc)" stroke-linecap="round" stroke-width="46">
    <path d="M 432 392 A 110 110 0 0 1 592 392"/>
    <path d="M 364 322 A 206 206 0 0 1 660 322"/>
    <path d="M 296 252 A 302 302 0 0 1 728 252"/>
  </g>
  <circle cx="512" cy="452" r="34" fill="url(#arc)"/>

  <!-- The couch -->
  <g filter="url(#shadow)" fill="url(#couch)">
    <!-- backrest -->
    <rect x="286" y="540" width="452" height="150" rx="56"/>
    <!-- armrests -->
    <rect x="196" y="600" width="128" height="222" rx="60"/>
    <rect x="700" y="600" width="128" height="222" rx="60"/>
    <!-- seat -->
    <rect x="286" y="676" width="452" height="146" rx="40"/>
    <!-- legs -->
    <rect x="252" y="806" width="44" height="58" rx="16"/>
    <rect x="728" y="806" width="44" height="58" rx="16"/>
  </g>
  <!-- cushion seam -->
  <rect x="505" y="692" width="14" height="104" rx="7" fill="#CFCBFA"/>
</svg>
