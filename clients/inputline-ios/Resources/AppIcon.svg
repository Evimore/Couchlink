<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- InputLine: a controller with a line of light running to a PC. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A3A"/>
      <stop offset="1" stop-color="#1B3F73"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#3FD2FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3FD2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="400" y1="600" x2="712" y2="380">
      <stop offset="0" stop-color="#3FD2FF"/>
      <stop offset="1" stop-color="#7CFFB2"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6F5"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#050B1E" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- The line, with its glow -->
  <path d="M 392 606 C 392 470, 712 540, 712 402" fill="none" stroke="url(#line)" stroke-width="64" stroke-linecap="round" opacity="0.55" filter="url(#blur)"/>
  <path d="M 392 606 C 392 470, 712 540, 712 402" fill="none" stroke="url(#line)" stroke-width="34" stroke-linecap="round"/>

  <!-- A pulse of input on its way -->
  <circle cx="552" cy="505" r="30" fill="#FFFFFF" opacity="0.45" filter="url(#blur)"/>
  <circle cx="552" cy="505" r="15" fill="#FFFFFF"/>

  <!-- The PC -->
  <g filter="url(#shadow)">
    <rect x="552" y="176" width="320" height="222" rx="34" fill="none" stroke="url(#pad)" stroke-width="30"/>
    <rect x="684" y="398" width="56" height="44" fill="url(#pad)"/>
    <rect x="628" y="436" width="168" height="30" rx="15" fill="url(#pad)"/>
  </g>
  <rect x="582" y="206" width="260" height="162" rx="14" fill="#3FD2FF" opacity="0.14"/>

  <!-- The controller -->
  <g filter="url(#shadow)" fill="url(#pad)">
    <rect x="176" y="596" width="432" height="176" rx="88"/>
    <circle cx="258" cy="752" r="96"/>
    <circle cx="526" cy="752" r="96"/>
  </g>
  <!-- d-pad -->
  <g fill="#1B3F73">
    <rect x="252" y="636" width="36" height="112" rx="10"/>
    <rect x="214" y="674" width="112" height="36" rx="10"/>
  </g>
  <!-- buttons -->
  <g fill="#1B3F73">
    <circle cx="530" cy="648" r="20"/>
    <circle cx="530" cy="736" r="20"/>
    <circle cx="486" cy="692" r="20"/>
    <circle cx="574" cy="692" r="20"/>
  </g>
  <!-- where the line leaves the controller -->
  <circle cx="392" cy="606" r="22" fill="#3FD2FF"/>
</svg>
